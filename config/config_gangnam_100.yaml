data:
  # 강남 단독 학습/실험 (멀티토포 대조군)
  topology: data/gangnam_clean_topology.json
  speed: data/gangnam_clean_speed_data.csv
experiments:
  models:
    rl_base: true
    rl_signal: true
    rl_signal_attention: true
    shortest_dijkstra: true
    static_fuel_dijkstra: true
  repeat: 30
  routes:
  - goal: '647033'
    name: gangnam_main
    start: '111357'
    type: long
  time_slots:
  - label: off_peak
    start_hour: 7.0
  - label: peak
    start_hour: 8.0
  experiment_route: gangnam_main
  experiment_time_slot: peak
output:
  model_dir: models
  result_dir: output
physics:
  accel_ms2: 2.5
  ifc_ml_s: 0.5
  speed_min_kmh: 5.0
  speed_noise: 0.2
  v_turn_left_kmh: 30.0
  v_turn_right_kmh: 20.0
reward:
  alpha: 1.0
  arrival_bonus: 200.0
  penalty_dead: 0.0
  penalty_timeout: 0.0
train:
  batch_size: 128
  checkpoint_every: 600
  episodes: 2400
  epsilon_decay: 0.9999
  epsilon_min: 0.05
  epsilon_start: 1.0
  gamma: 0.97
  log_interval: 50
  lr: 0.0005
  memory_size: 50000
  multi_route: true
  shaping_weight: 0.0
  target_update: 25
  warmup_steps: 1500
  train_max_steps: 120
  # ── 강남 100% 단독 학습 (대조 실험) ──
  topologies:
  - topology: data/gangnam_clean_topology.json
    speed: data/gangnam_clean_speed_data.csv
    weight: 1.0
    n_random_routes: 24        # 멀티토포(20)와 비슷하게 유지 → 변수는 weight 18%→100% 하나만
