# config_gangnam.yaml
# 강남구 실도로망(1995 노드) 전용 — 2026-05-29 신논현역 재실험.
#
# OD-1 변경: 한남IC(341188) → 신논현역 일대(342695)
#   사유: 기존 OD-1은 5모델 경로 거의 동일 → 성능 차이 −2.7~−6.9% 미약.
#   신논현역 일대 출발 시 거리최단 Dijkstra는 강남대로 한복판 정체 통과,
#   fuel TDD는 한강·강남구 자동차전용 corridor 우회 → 사전 검증 peak −22.4%.
#
# 학습 강화 (RL 성능 극대화):
#   episodes 10000→15000, train_max_steps 300→400 (긴 우회 corridor 대비),
#   arrival_bonus 500→700, epsilon_decay 0.99997→0.999975,
#   checkpoint_every 2500→1500 (overshoot 방지),
#   primary_boost OD-1 0→4 (OD-1 학습 비중 71%).
#   U턴 페널티는 _train_common.py 학습 루프에서 -20 mL/U턴 추가.
data:
  topology: data/gangnam_clean_topology.json
  speed: data/gangnam_clean_speed_data.csv
experiments:
  models:
    shortest_dijkstra: true
    static_fuel_dijkstra: true
    rl_base: true
    rl_signal: true
    rl_signal_attention: true
  repeat: 30
  # ── 현실적 OD 3쌍 (OD-1 신논현역으로 갱신) ──
  routes:
  - {name: od1_sinnonhyeon_suseo, start: '342695', goal: '613667', type: long}
  - {name: od2_yangjae_yeongdong, start: '338734', goal: '342812', type: long}
  - {name: od3_segok_samsung,    start: '340301', goal: '341509', type: long}
  time_slots:
  - {label: off_peak, start_hour: 7.0}
  - {label: peak,     start_hour: 8.0}
output:
  model_dir: models
  result_dir: output
physics:
  accel_ms2: 2.5
  ifc_ml_s: 0.5
  speed_min_kmh: 5.0
  speed_noise: 0.2
  v_turn_left_kmh: 30.0
  v_turn_right_kmh: 20.0
reward:
  alpha: 1.0
  # 강남구 OD 평균 fuel 1500~2500mL 기준 arrival/fuel ≈ 0.3 비율 (12x12 0.2 보다↑).
  # 신논현 OD-1 거리 9~10km 로 길어 도달 인센티브 강화 필요.
  arrival_bonus: 700.0
  penalty_dead: 0.0
  penalty_timeout: 0.0
  # ── U턴 페널티 (이전 OD-3 stub trap 실패 해소) ──
  # _train_common.py 에서만 사용. info.movement == "uturn" 일 때 -uturn_penalty
  # 만큼 추가 부과 (eval 시 Dijkstra는 U턴 없음 — 영향 없음).
  uturn_penalty: 20.0
train:
  batch_size: 128
  checkpoint_every: 1500       # best.pth overshoot/drift 방지 (보고서 §10.3)
  episodes: 15000              # 신논현 OD-1 학습 cardinality 보강
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.999975      # 긴 episode (avg ~280 step) 더 보수적 탐색
  gamma: 0.97
  log_interval: 100
  lr: 0.0005
  memory_size: 80000
  multi_route: true
  target_update: 25
  warmup_steps: 2000
  train_max_steps: 400         # 우회 corridor (~10km, ~80~120 step) 대비 4~5배 여유
  shaping_weight: 1500.0       # 텔레스코핑 합 = w·(d_start−d_end)/map_diag, policy invariance 유지
  topologies:
  - topology: data/gangnam_clean_topology.json
    speed: data/gangnam_clean_speed_data.csv
    weight: 1.0
    use_config_routes: true
    primary_boost: 4           # OD-1 추가 복제 4회 → 학습 비중 5/7 ≈ 71%
