# config_od1.yaml — OD1 특화모델 (단일 OD 학습, v3 환경 258d)
data: {topology: data/gangnam_clean_topology.json, speed: data/gangnam_clean_speed_data.csv}
experiments:
  models: {shortest_dijkstra: true, static_fuel_dijkstra: true, rl_base: true, rl_signal: true, rl_signal_attention: true}
  repeat: 30
  routes:
  - {name: od1_sinnonhyeon_suseo, start: '342695', goal: '613667', type: long}
  time_slots:
  - {label: peak, start_hour: 8.0}
output: {model_dir: models, result_dir: output}
physics: {accel_ms2: 2.5, ifc_ml_s: 0.5, speed_min_kmh: 5.0, speed_noise: 0.2, v_turn_left_kmh: 30.0, v_turn_right_kmh: 20.0}
reward: {alpha: 1.0, arrival_bonus: 700.0, penalty_dead: 0.0, penalty_timeout: 0.0, uturn_penalty: 300.0, revisit_penalty: 50.0, step_penalty: 6.0}
train:
  batch_size: 128
  checkpoint_every: 999999
  episodes: 6000
  epsilon_start: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.9997
  gamma: 0.97
  log_interval: 100
  lr: 0.0005
  memory_size: 60000
  multi_route: true
  target_update: 25
  warmup_steps: 1500
  train_max_steps: 300
  shaping_weight: 2500.0
  dynamic_od_boost: false
  penalty_anneal_frac: 0.5
  penalty_floor: 0.2
  topologies:
  - {topology: data/gangnam_clean_topology.json, speed: data/gangnam_clean_speed_data.csv, weight: 1.0, use_config_routes: true}
